<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    transition: background 0.2s;
    padding: 1rem;
  }
  .clock { text-align: center; user-select: none; }
  .time {
    font-size: clamp(2.5rem, 14vw, 6rem);
    font-weight: 500;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .time .ms { font-size: 0.6em; opacity: 0.9; margin-left: 0.1em; }
  .date {
    font-size: clamp(1.1rem, 4vw, 1.8rem);
    margin-top: 0.8rem;
    opacity: 0.9;
    text-transform: capitalize;
  }
  .settings-btn {
    position: fixed;
    top: 1rem; left: 1rem;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 0.6rem 1.1rem;
    border-radius: 40px;
    font-size: 1rem;
    cursor: pointer;
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .settings-btn:hover { background: rgba(255,255,255,0.3); }
  .panel {
    position: fixed;
    top: 4.3rem; left: 1rem;
    background: rgba(20,20,30,0.95);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 1.5rem;
    width: 320px;
    max-width: calc(100vw - 2rem);
    display: none;
    flex-direction: column;
    gap: 1.3rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    z-index: 20;
  }
  .panel.open { display: flex; }
  .panel h3 { font-weight: 400; font-size: 1.15rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
  .row { display: flex; flex-direction: column; gap: 0.5rem; }
  .row label { font-size: 0.9rem; opacity: 0.9; }
  .color-row { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  input[type="color"] {
    width: 55px; height: 44px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    padding: 3px;
  }
  .btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 0.55rem 1rem;
    border-radius: 40px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn:hover { background: rgba(255,255,255,0.25); }
  .alarm-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  input[type="time"] {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 0.5rem 0.7rem;
    border-radius: 20px;
    font-size: 1rem;
    flex: 1 1 110px;
  }
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  .status { font-size: 0.9rem; opacity: 0.85; }
  .badge { background: #3a6ea5; padding: 0.15rem 0.7rem; border-radius: 30px; font-size: 0.8rem; margin-right: 0.3rem; }
  .clear { border-color: rgba(255,100,100,0.6); color: #ff9f9f; }
  @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .alarm-active .time { animation: flash 0.6s infinite; }
</style>
</head>
<body>
<button class="settings-btn" id="settingsBtn">⚙️ Settings</button>

<div class="panel" id="panel">
  <h3>Appearance & Alarm</h3>
  <div class="row">
    <label>Background color</label>
    <div class="color-row">
      <input type="color" id="colorPicker" value="#000000">
      <button class="btn" id="resetBtn">Default black</button>
    </div>
  </div>
  <div class="row">
    <label>⏰ Alarm</label>
    <div class="alarm-row">
      <input type="time" id="alarmInput" step="1">
      <button class="btn" id="setBtn">Set</button>
      <button class="btn clear" id="clearBtn">Clear</button>
    </div>
    <div class="status" id="status">No alarm set</div>
  </div>
</div>

<div class="clock" id="clock">
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>
</div>

<script>
(function () {
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const clockEl = document.getElementById('clock');
  const settingsBtn = document.getElementById('settingsBtn');
  const panel = document.getElementById('panel');
  const colorPicker = document.getElementById('colorPicker');
  const resetBtn = document.getElementById('resetBtn');
  const alarmInput = document.getElementById('alarmInput');
  const setBtn = document.getElementById('setBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');

  let alarmTime = null;       // "HH:MM:SS"
  let firedSecond = null;     // to prevent re-trigger within same second
  let audioCtx = null;

  // ---- background ----
  function setBg(color) {
    document.body.style.background = color;
    colorPicker.value = color;
  }
  setBg('#000000');

  colorPicker.addEventListener('input', e => setBg(e.target.value));
  resetBtn.addEventListener('click', () => setBg('#000000'));

  // ---- settings panel toggle ----
  settingsBtn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== settingsBtn) panel.classList.remove('open');
  });
  panel.addEventListener('click', e => e.stopPropagation());

  // ---- alarm logic ----
  function updateStatus() {
    if (alarmTime) {
      statusEl.innerHTML = `<span class="badge">⏰ Alarm</span>${alarmTime}`;
    } else {
      statusEl.textContent = 'No alarm set';
    }
  }

  function setAlarm() {
    let val = alarmInput.value;
    if (!val) { clearAlarm(); return; }
    if (val.length === 5) val += ':00';
    const [h, m, s] = val.split(':').map(Number);
    if (isNaN(h) || isNaN(m) || isNaN(s) || h > 23 || m > 59 || s > 59) return;
    alarmTime = val;
    firedSecond = null;
    alarmInput.value = val;
    updateStatus();
  }

  function clearAlarm() {
    alarmTime = null;
    firedSecond = null;
    alarmInput.value = '';
    clockEl.classList.remove('alarm-active');
    updateStatus();
  }

  setBtn.addEventListener('click', setAlarm);
  clearBtn.addEventListener('click', clearAlarm);
  alarmInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); setAlarm(); } });

  // ---- beep sound (Web Audio) ----
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
      osc.stop(audioCtx.currentTime + 0.8);
    } catch (e) { /* silent */ }
  }

  function triggerAlarm() {
    clockEl.classList.add('alarm-active');
    beep();
    // second beep after 0.4s for a clearer sound
    setTimeout(() => beep(), 400);
    statusEl.innerHTML = `<span class="badge" style="background:#b33;">🔔 ALARM!</span>${alarmTime}`;
    setTimeout(() => {
      clockEl.classList.remove('alarm-active');
      updateStatus();
    }, 2000);
  }

  // ---- main clock loop ----
  function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const ms = String(now.getMilliseconds()).padStart(3, '0');

    timeEl.innerHTML = `${hh}:${mm}:${ss}<span class="ms">.${ms}</span>`;

    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const d = now.getDate();
    let suffix = 'th';
    if (d % 10 === 1 && d !== 11) suffix = 'st';
    else if (d % 10 === 2 && d !== 12) suffix = 'nd';
    else if (d % 10 === 3 && d !== 13) suffix = 'rd';
    dateEl.textContent = `${days[now.getDay()]} ${d}${suffix} ${months[now.getMonth()]} ${now.getFullYear()}`;

    // alarm check
    const current = `${hh}:${mm}:${ss}`;
    if (alarmTime && current === alarmTime && firedSecond !== current) {
      firedSecond = current;
      triggerAlarm();
    }
    // reset fired flag once second changes so it can fire again next day
    if (firedSecond && current !== firedSecond) firedSecond = null;

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
  updateStatus();
})();
</script>
</body>
</html>
